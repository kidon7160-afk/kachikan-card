<!doctype html>
<html lang="ja"><head>
<title>価値観カード 2人で体験</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: a studio bench with two phones side by side (you / your match).
   The host app is deliberately plain and unbranded; only the card game inside it
   carries the retro-pop identity, so it reads as an add-on to any app. */
:root{
  --stage:#EDE7F1;
  --ink:#2A1F3D;
  --muted:#6B6280;
  --paper:#FFFBF6;
  --base:#F4CDD2;
  --accent:#360EC4;
  --accent2:#E466A8;
  --host:#2E6E6B;
  --host-soft:#E3F0EF;
  --host-bg:#FAFAFC;
  --host-line:#E3E1EA;
  --host-text:#23222B;
  --onri:#FFD016; --earth:#04BF77; --logica:#E466A8; --chroni:#EB786F; --link:#34BCDE; --move:#A179E9;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);line-height:1.6}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg .ink{stroke:var(--ink)}

.page{
  max-width:900px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px;
}
.top h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.4rem,3.4vw,1.9rem);margin:0 0 6px;line-height:1.3}
.top p{margin:0;color:var(--muted);font-size:.9rem;max-width:62ch}

.controls{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  margin:18px 0 20px;padding:12px 16px;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;
}
.controls label{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:700}
.controls input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.controls select{
  font-family:inherit;font-size:.84rem;padding:5px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);
}
.cbtn{
  font-size:.82rem;font-weight:700;padding:7px 14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;
  box-shadow:2px 2px 0 var(--ink);
}
.cbtn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

.booth .top p,.booth .notes,.booth .tabs,.booth .only-demo{display:none!important}
.booth .stage[data-tab] .phone-col{display:flex!important}
.booth .stage{flex-wrap:nowrap;gap:20px}
.booth .page{max-width:1000px}
.booth .top h1{font-size:1.1rem}
.controls input[type=text]{font-family:inherit;font-size:.84rem;padding:5px 10px;border:2px solid var(--ink);border-radius:8px;min-width:0;flex:1 1 160px}
.tabs{display:none;gap:8px;margin-bottom:14px}
.tabs button{
  flex:1;padding:9px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:.88rem;
}
.tabs button[aria-pressed=true]{background:var(--accent);color:#fff}

.stage{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.phone-col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;flex:0 1 340px}
.who{font-family:var(--f-display);font-weight:900;font-size:.95rem}
.who small{font-weight:500;color:var(--muted);font-family:var(--f-body)}
.phone{
  width:100%;max-width:340px;height:690px;
  background:var(--host-bg);color:var(--host-text);
  border:3px solid var(--ink);border-radius:38px;overflow:hidden;
  box-shadow:8px 8px 0 var(--ink);
  display:flex;flex-direction:column;position:relative;
}
@media(max-width:780px){
  .tabs{display:flex}
  .stage[data-tab=me] .phone-col[data-who=pt]{display:none}
  .stage[data-tab=pt] .phone-col[data-who=me]{display:none}
}

/* ---- host app (plain, unbranded) ---- */
.status{display:flex;justify-content:space-between;padding:8px 22px 0;font-size:.7rem;font-weight:700;background:#fff;height:28px}
.hdr{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;background:#fff;border-bottom:1px solid var(--host-line)}
.ic{border:0;background:none;font-size:1.5rem;line-height:1;padding:0 4px;color:var(--muted)}
.whobtn{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0}
.whobtn b{display:block;font-size:.95rem;line-height:1.2}
.whobtn small{color:var(--muted);font-size:.72rem}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.pbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.chat{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;font-size:.85rem;line-height:1.5;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--host);color:#fff;border-bottom-right-radius:4px}
.msg.theirs{align-self:flex-start;background:#fff;border:1px solid var(--host-line);border-bottom-left-radius:4px}
.sys{align-self:center;font-size:.72rem;color:var(--muted);background:#fff;border:1px solid var(--host-line);padding:3px 12px;border-radius:999px}
.cardsmsg{
  max-width:90%;background:var(--base);color:var(--ink);border:2.5px solid var(--ink);border-radius:16px;padding:9px 11px;box-shadow:3px 3px 0 var(--ink);
}
.cardsmsg.mine{align-self:flex-end;border-bottom-right-radius:4px}
.cardsmsg.theirs{align-self:flex-start;border-bottom-left-radius:4px}
.cardsmsg h4{font-family:var(--f-display);font-weight:900;font-size:.8rem;margin:0 0 6px}
.cardsmsg .cc{display:flex;flex-wrap:wrap;gap:5px}
.cardsmsg .cc span{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px 2px 3px;font-size:.76rem;font-weight:700}
.cardsmsg .cc i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--accent2);color:#fff;font-size:.62rem;display:inline-flex;align-items:center;justify-content:center;font-weight:900}
.cardsmsg .rs{margin-top:7px;font-size:.74rem;border-top:1.5px dashed var(--ink);padding-top:6px}
.suggest{padding:0 12px 8px}
.suggest button{
  font-size:.78rem;font-weight:700;padding:6px 14px;border-radius:999px;border:1.5px dashed var(--host);background:var(--host-soft);color:var(--host);
}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--host-line)}
.composer input{
  flex:1;min-width:0;border:1px solid var(--host-line);border-radius:999px;padding:9px 14px;font-family:inherit;font-size:.85rem;background:var(--host-bg);color:var(--host-text);
}
.cardbtn{
  width:38px;height:38px;border-radius:12px;border:2.5px solid var(--ink);background:var(--base);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:2px 2px 0 var(--ink);padding:0;
}
.cardbtn:disabled{opacity:.4;box-shadow:none}
.send{border:0;background:var(--host);color:#fff;font-weight:700;font-size:.8rem;padding:9px 14px;border-radius:999px}

/* ---- game module (retro-pop) ---- */
.inv{
  align-self:stretch;background:var(--base);border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;
  box-shadow:3px 3px 0 var(--ink);font-family:var(--f-body);
}
.inv h4{font-family:var(--f-display);font-weight:900;margin:0 0 4px;font-size:.92rem;color:var(--ink)}
.inv p{margin:0 0 10px;font-size:.78rem;color:var(--ink)}
.inv .row{display:flex;gap:6px;flex-wrap:wrap}
.inv .st{font-size:.76rem;font-weight:700;color:var(--accent)}
.gbtn{
  font-family:var(--f-display);font-weight:700;font-size:.82rem;padding:8px 14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);
  box-shadow:2px 2px 0 var(--ink);
}
.gbtn.pri{background:var(--accent);color:#fff}
.gbtn:hover:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.gbtn:disabled{opacity:.4;box-shadow:none}
.linkbtn{border:0;background:none;font-size:.76rem;color:var(--muted);text-decoration:underline;padding:4px}

.live{position:absolute;right:8px;bottom:8px;width:68%;max-width:240px;z-index:3;display:flex;flex-direction:column;gap:4px;pointer-events:none;font-family:var(--f-body)}
.live .cm{align-self:flex-end;max-width:100%;background:rgba(42,31,61,.72);color:#fff;border-radius:12px;padding:3px 9px;font-size:.7rem;line-height:1.35;overflow-wrap:anywhere;animation:lvin .25s ease-out}
.live .cm b{font-weight:700;opacity:.75;margin-right:5px}
.live .cm.o1{opacity:.7}.live .cm.o2{opacity:.45}
.live .stamps,.live .lvrow{pointer-events:auto;display:flex;gap:3px;justify-content:flex-end;flex-wrap:nowrap}
.live .stamp{border:1.5px solid var(--ink);background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;font-size:.64rem;padding:2px 6px;font-weight:700;white-space:nowrap}
.live input{width:100%;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);font-size:.7rem;padding:5px 10px;font-family:inherit}
@keyframes lvin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shimg{width:100%;border:2.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);display:block;margin:0 0 12px;background:#fff}
.shbox{max-height:100%;overflow:auto}
.shnote{font-size:.72rem;color:var(--ink);margin:0 0 10px}
.sheet{position:absolute;inset:0;background:rgba(42,31,61,.45);display:flex;align-items:flex-end;z-index:5}
.sheet .card{
  width:100%;background:var(--base);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;padding:20px 18px 22px;color:var(--ink);
}
.sheet h3{font-family:var(--f-display);font-weight:900;margin:0 0 6px;font-size:1.05rem}
.sheet p{margin:0 0 14px;font-size:.84rem}
.sheet .row{display:flex;gap:8px}
.sheet .row .gbtn{flex:1}

.game{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--base);color:var(--ink);padding:10px 14px 12px;gap:9px;overflow:auto}
.g-top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.g-top b{font-family:var(--f-display);font-weight:900;font-size:.95rem}

.game.g2,.net .game.g2{padding:0;gap:0;background:var(--base)}
.zone.op{background:var(--accent);color:#fff;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.net .zone.op{padding-top:max(14px,env(safe-area-inset-top))}
.zone .zname{font-size:.78rem;font-weight:700;opacity:.9}
.bubble{position:relative;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:9px 16px;text-align:center;font-family:var(--f-display);font-weight:900;font-size:.92rem;line-height:1.4;margin-bottom:6px}
.bubble::after{content:"";position:absolute;left:34px;bottom:-9px;width:14px;height:14px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble.dim{background:rgba(255,255,255,.88);font-weight:700}
.oppills{display:flex;flex-wrap:wrap;gap:6px}
.oppills span{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:3px 13px;min-width:52px;min-height:28px;font-size:.78rem;font-weight:700;text-align:center;line-height:1.5}
.oppills span.e{background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.7);color:transparent}
.zone.me{flex:1;min-height:0;background:var(--base);padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px}
.zlabel{font-size:.74rem;font-weight:700;color:var(--muted);margin:2px 0 -3px}
.tut{position:absolute;inset:0;z-index:9}
.tut.full{background:rgba(15,10,30,.8);display:flex;align-items:center;justify-content:center;padding:18px}
.tut .hl{position:absolute;border-radius:16px;box-shadow:0 0 0 3000px rgba(15,10,30,.8);outline:3px solid #FFD016;pointer-events:none}
.tut .pop{width:100%;background:var(--base);border:3px solid var(--ink);border-radius:26px;padding:16px;box-shadow:6px 6px 0 var(--ink);color:var(--ink)}
.tut .say{background:#fff;border:2.5px solid var(--accent);border-radius:16px;box-shadow:5px 5px 0 var(--accent);padding:14px 12px;text-align:center;font-family:var(--f-display);font-weight:900;color:var(--accent);line-height:1.9;font-size:.95rem}
.tut .chars{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;margin:12px 0 4px}
.tut .chars svg{width:62px;height:62px}
.tut .ask{text-align:center;font-family:var(--f-display);font-weight:900;font-size:.95rem;margin:2px 0 10px}
.tut .bub{position:absolute;left:14px;right:14px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;font-size:.86rem;line-height:1.65;box-shadow:4px 4px 0 var(--accent)}
.tut .bub small{display:block;color:var(--muted);font-weight:700;font-size:.7rem;margin-bottom:2px}
.tut .trow{display:flex;gap:8px;margin-top:10px;align-items:center}
.tut .trow .gbtn{flex:1}
.tut .skip{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.76rem;padding:6px}
.tut .pop .skip{color:var(--ink);opacity:.7}
.sheet .sample{font-size:.76rem;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:6px 10px;margin:0 0 14px}
.ptstrip{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:7px 10px;font-size:.74rem;min-height:56px}
.ptstrip b{font-weight:700}
.ptstrip .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ptstrip .chips span{background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:.68rem}
.bar{height:7px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.drawn{
  background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 12px 18px;text-align:center;box-shadow:5px 5px 0 var(--ink);
}
.drawn small{display:block;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.06em}
.drawn .w{font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1.3;margin-top:6px;overflow-wrap:anywhere}
.drawn.wait{opacity:.72;box-shadow:3px 3px 0 var(--ink)}
.acts{display:flex;gap:10px}
.acts .gbtn{flex:1;font-size:.95rem;padding:11px}
.prompt{font-size:.8rem;font-weight:700;text-align:center;color:var(--accent)}
.hand{display:flex;flex-direction:column;gap:5px}
.slot{
  display:flex;align-items:center;gap:8px;padding:5px 10px;min-height:32px;
  border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:.82rem;font-weight:700;text-align:left;width:100%;
}
.slot.empty{border-style:dashed;background:transparent;color:var(--muted);font-weight:500}
.slot.pick{outline:3px solid var(--accent);outline-offset:1px;background:#fff}
.slot .n{
  width:20px;height:20px;border-radius:50%;background:var(--accent2);color:#fff;font-size:.68rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;
}
.slot .n.on{background:var(--accent)}
.sub{font-family:var(--f-display);font-weight:900;font-size:1.05rem;margin:2px 0 0}
.hint{font-size:.78rem;margin:0}
.game textarea{
  width:100%;min-height:110px;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:.88rem;background:#fff;color:var(--ink);resize:vertical;
}
.sp{flex:1}

.res .charwrap{
  width:112px;height:112px;margin:2px auto 0;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--ink);
}
.res .tname{font-family:var(--f-display);font-weight:900;font-size:1.5rem;text-align:center;line-height:1.2}
.res .tcat{text-align:center;font-weight:700;font-size:.8rem}
.res .tdesc{font-size:.76rem;margin:0;text-align:center}
.mini{display:flex;flex-direction:column;gap:4px}
.mini .it{display:flex;gap:7px;align-items:center;font-size:.8rem;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:9px;padding:3px 9px}
.slotn{width:20px;height:20px;border-radius:50%;background:var(--accent2);color:#fff;font-size:.68rem;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.quote{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:7px 10px;font-size:.78rem}
.sw{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700}
.sw button{
  width:42px;height:24px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;position:relative;padding:0;flex-shrink:0;
}
.sw button::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw button[aria-checked=true]{background:var(--accent)}
.sw button[aria-checked=true]::after{transform:translateX(17px);background:#fff}
.note{font-size:.72rem;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;margin:0}

/* ===== Figma design (graduation prototype v11): game screen / guide ===== */
:root{--fk:#353535;--fgray:#6f6f6f;--fovl:rgba(59,60,65,.9)}
.game.g2,.net .game.g2{position:relative;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--base);padding-bottom:0}
.game>*{flex-shrink:0}
.game.g2>.zone{flex:0 0 auto}
.game.g2>.zone.me{flex:1 0 auto}
.zone.me>*{flex-shrink:0}
.zone.op>*{flex-shrink:0}
.game.g2::before{content:"";position:absolute;left:50%;top:-610px;width:889px;height:889px;margin-left:-444px;border-radius:50%;background:var(--accent);z-index:0}
.game.g2 .zone{position:relative;z-index:1}
.zone.op{background:none;padding:6px 6.5% 0;gap:0}
.net .zone.op{padding-top:max(10px,env(safe-area-inset-top))}
.zone .zname{font-size:.86rem;font-weight:500;opacity:1;margin:0 0 3px 9px;color:#fff}
.bubble{background:#fff;color:var(--fk);border:3px solid var(--fk);border-radius:22px;padding:8px 16px;font-family:inherit;font-weight:600;font-size:1rem;line-height:1.35;margin:0 0 14px}
.bubble::after{left:calc(50% + 14px);bottom:-10px;width:15px;height:15px;transform:rotate(45deg);background:#fff;border-right:3px solid var(--fk);border-bottom:3px solid var(--fk)}
.bubble.dim{background:#fff;color:var(--fgray);font-weight:500}
.oppills{gap:5px 8px}
.oppills span{background:#fff;color:var(--fk);border:3px solid var(--fk);border-radius:18px;padding:3px 17px;min-width:0;min-height:0;height:33px;box-sizing:border-box;font-size:.88rem;font-weight:500;line-height:1.5;display:flex;align-items:center}
.oppills span.e{background:#5430cc;border:3px dashed #ccc1f1;color:transparent;width:106px;padding:0}
.zone.me{background:none;padding:12px 6.7% 74px;gap:0;flex:1;min-height:0}
.g-top{color:#fff;font-size:.75rem;padding:0 11px;margin-bottom:9px}
.g-top b{font-family:inherit;font-weight:500;font-size:.75rem}
.drawn{background:#fff;border:4px solid var(--fk);border-radius:16px;padding:16px 12px 14px;min-height:104px;box-sizing:border-box;box-shadow:5px 7px 0 var(--fk);display:flex;flex-direction:column;justify-content:center}
.drawn small{color:var(--fgray);font-size:.88rem;font-weight:500;letter-spacing:0}
.drawn .w{font-family:inherit;font-weight:600;font-size:2.1rem;color:var(--fk);margin-top:4px;line-height:1.25}
.drawn.wait{opacity:.8;box-shadow:5px 7px 0 var(--fk)}
.acts{gap:20px;margin-top:20px}
.acts .gbtn{height:48px;padding:0;border:3px solid var(--fk);border-radius:25px;font-family:inherit;font-weight:600;font-size:1rem;color:var(--fk);box-shadow:5px 6px 0 var(--fk)}
.acts .gbtn.pri{background:#370dc4;color:#fff}
.acts .gbtn:hover:not(:disabled){transform:none;box-shadow:5px 6px 0 var(--fk)}
.zone.me .zlabel{color:var(--fgray);font-size:.75rem;font-weight:500;margin:18px 0 7px}
.zone.me .hand{gap:6px}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var RNG=Math.random;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(RNG()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function word(i){return CARDS[i][0]}
function newPhone(){return {tut:null,screen:"chat",g:null,consent:false,profileOn:false,profileView:"other",composer:"",sheet:false}}
function newState(prev){
  return {
    showMoves:prev?prev.showMoves:true,auto:prev?prev.auto:true,ptConsent:prev?prev.ptConsent:"yes",deckSize:prev?prev.deckSize:44,
    inviteState:null,inviter:null,revealed:false,playing:false,live:[],
    deck:[],cur:null,turn:null,first:"me",round:null,
    msgs:[
      {from:"pt",text:"はじめまして！プロフィールの写真、海ですか？"},
      {from:"me",text:"はじめまして。去年の夏に撮ったものです"},
      {from:"pt",text:"いいですね。私は休みの日はだいたい散歩です"}
    ],
    p:{me:newPhone(),pt:newPhone()}
  };
}

/* ---------- game logic ---------- */
/* One shared deck. Each card is shown to both players; the first decider
   alternates every card, so nobody always decides before the other. */
function startGame(){
  S.deck=shuffle(CARDS.map(function(_,i){return i})).slice(0,S.deckSize);
  S.first="me";S.round=null;S.live=[];
  S.cur=S.deck.pop();S.turn=S.first;
  ["me","pt"].forEach(function(w){
    S.p[w].g={hand:[],discard:[],swap:false,decision:null,order:[],reason:"",result:null};
    S.p[w].screen="game";S.p[w].consent=false;S.p[w].tut=(w==="me")?0:null;
  });
}
function decide(w,text){
  var g=S.p[w].g;
  g.decision={card:S.cur,text:text};g.swap=false;
  if(w===S.first){S.turn=other(w);return}
  S.round={card:S.cur,me:S.p.me.g.decision.text,pt:S.p.pt.g.decision.text};
  S.first=other(S.first);
  S.p.me.g.decision=null;S.p.pt.g.decision=null;
  if(S.deck.length){S.cur=S.deck.pop();S.turn=S.first}
  else{
    S.cur=null;S.turn=null;
    ["me","pt"].forEach(function(x){S.p[x].screen=S.p[x].g.hand.length===5?"order":"refill"});
  }
}
function computeResult(w){
  var g=S.p[w].g;
  var ordered=g.order.map(function(i){return g.hand[i]});
  var scores={onri:0,earth:0,logica:0,chroni:0,link:0,move:0};
  ordered.forEach(function(ci,r){scores[CARDS[ci][1]]+=RW[r]});
  function best(t){var b=Infinity;ordered.forEach(function(ci,r){if(CARDS[ci][1]===t&&r<b)b=r});return b}
  var ranked=TYPE_ORDER.slice().sort(function(a,b){return scores[b]-scores[a]||best(a)-best(b)});
  g.result={ordered:ordered,scores:scores,ranked:ranked,top:ranked[0]};
}
function checkReveal(){
  if(S.p.me.consent&&S.p.pt.consent){
    ["me","pt"].forEach(function(w){if(S.p[w].screen==="result")S.p[w].screen="shared"});
  }
}

/* ---------- actions ---------- */
function act(w,name,arg){
  var p=S.p[w],g=p.g,o=other(w);
  switch(name){
    case "openSheet":p.sheet=true;break;
    case "closeSheet":p.sheet=false;break;
    case "invite":
      p.sheet=false;S.inviter=w;S.inviteState="pending";
      S.msgs.push({type:"invite",from:w});break;
    case "accept":
      S.inviteState="accepted";S.playing=true;
      S.msgs.push({type:"sys",text:"価値観カードをはじめました"});
      startGame();break;
    case "later":S.inviteState="later";break;
    case "decline":S.inviteState="declined";break;
    case "send":
      var tx=(arg!==undefined?arg:p.composer)||"";
      if(tx.trim()){S.msgs.push({from:w,text:tx.trim()});if(arg===undefined)p.composer=""}break;
    case "fillSuggest":p.composer="もしよければ、今度会って続きを話してみませんか？";break;
    case "keep":
      if(!g||S.cur==null||S.turn!==w)break;
      if(g.hand.length<5){g.hand.push(S.cur);decide(w,"残した")}
      else{g.swap=true}
      break;
    case "drop":
      if(!g||S.cur==null||S.turn!==w)break;
      g.discard.push(S.cur);decide(w,"手放した");break;
    case "swapTo":
      if(!g||!g.swap||S.turn!==w)break;
      var out=g.hand[arg];g.hand[arg]=S.cur;g.discard.push(out);
      decide(w,"残した(「"+word(out)+"」と入れ替え)");break;
    case "cancelSwap":if(g)g.swap=false;break;
    case "refill":
      if(!g||g.hand.length>=5)break;
      g.hand.push(g.discard.splice(arg,1)[0]);
      if(g.hand.length===5)p.screen="order";break;
    case "ord":
      var at=g.order.indexOf(arg);
      if(at>-1)g.order.splice(at,1);else if(g.order.length<5)g.order.push(arg);break;
    case "orderDone":if(g.order.length===5)p.screen="reason";break;
    case "reasonDone":if(arg!==undefined)g.reason=arg;computeResult(w);p.screen="result";if(S.p[o].consent&&S.p[o].screen==="result")S.p[o].screen="shared";break;
    case "consent":p.consent=true;if(S.p[o].g&&S.p[o].g.result)p.screen="shared";break;
    case "withdraw":p.consent=false;break;
    case "endPrivate":p.consent=false;p.screen="chat";break;
    case "toChat":
      p.screen="chat";
      if(!S.revealed){
        S.revealed=true;S.msgs.push({type:"sys",text:"お互いの5枚を見せ合いました"});
        ["me","pt"].forEach(function(x){
          var gx=S.p[x].g;
          if(gx&&gx.result)S.msgs.push({type:"cards",from:x,items:gx.result.ordered.map(word),reason:gx.reason.trim()});
        });
      }break;
    case "quit":
      ["me","pt"].forEach(function(x){S.p[x].screen="chat";S.p[x].g=null;S.p[x].consent=false});
      S.playing=false;S.cur=null;S.turn=null;S.live=[];
      S.msgs.push({type:"sys",text:PERSONA[w].name+"さんが、ここで一度お休みすることにしました"});break;
    case "live":S.live.push({from:w,text:arg});if(S.live.length>30)S.live.shift();break;
    case "liveSend":var lt=(arg!==undefined?arg:p.liveText)||"";if(lt.trim()){S.live.push({from:w,text:lt.trim()});if(arg===undefined)p.liveText="";if(S.live.length>30)S.live.shift()}break;
    case "tutNext":if(p.tut!=null){p.tut=(p.tut>=TUT.length-1)?null:p.tut+1}break;
    case "tutSkip":p.tut=null;break;
    case "toggleProfile":p.profileOn=!p.profileOn;break;
    case "openShare":p.share={withCards:false,url:null,msg:""};buildShare(w);break;
    case "closeShare":p.share=null;break;
    case "shareCards":if(p.share){p.share.withCards=!p.share.withCards;p.share.url=null;buildShare(w)}break;
    case "saveShare":saveShare(w);break;
    case "openProfile":p.profileView=arg;p.screen="profile";break;
    case "closeProfile":p.screen=(g&&g.result&&p.screen==="profile"&&p.fromResult)?"result":"chat";p.fromResult=false;break;
    case "openOwnFromResult":p.profileView="self";p.fromResult=true;p.screen="profile";break;
  }
  refresh();
}


/* ---------- SNS share image (own type only) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
function charImage(t){
  return new Promise(function(res){
    var sym=document.getElementById("char-"+t);
    if(!sym){res(null);return}
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="400" height="400">'+sym.innerHTML+'</svg>';
    var img=new Image();
    img.onload=function(){res(img)};img.onerror=function(){res(null)};
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}
function wrapText(c,text,maxW){
  var lines=[],cur="";
  for(var i=0;i<text.length;i++){var ch=text[i];if(c.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch}
  if(cur)lines.push(cur);return lines;
}
async function makeShareCanvas(w,withCards){
  /* Figma「保存される画像」: 黄(タイプ色)の縁のカード。キャラ・タイプ名・特徴・選んだカード */
  var r=S.p[w].g.result,t=TYPES[r.top],tc=TYPE_COLOR[r.top],K=3,M=48;
  var cw=337*K,pad=26*K,acc="#360EC4";
  var cv=document.createElement("canvas"),c=cv.getContext("2d");
  /* 先に高さを測る */
  c.font='500 '+(12*K)+'px "Zen Maru Gothic",sans-serif';
  var dl=wrapText(c,t.desc,cw-pad*2-20*K);
  var chipRows=[];
  c.font='500 '+(12*K)+'px "Zen Maru Gothic",sans-serif';
  var row=[],rw=0,maxRow=cw-pad*2-20*K;
  r.ordered.forEach(function(ci){var wd=c.measureText(word(ci)).width+20*K;if(rw+wd>maxRow&&row.length){chipRows.push(row);row=[];rw=0}row.push([word(ci),wd]);rw+=wd+8*K});
  if(row.length)chipRows.push(row);
  var y0=28*K,charH=200*K,nameY=y0+charH+50*K,catY=nameY+30*K,descY=catY+30*K,chipY=descY+dl.length*20*K+12*K;
  var chipBlock=chipRows.length*30*K+8*K;/* 5枚の有無でカードの大きさを変えない。無いときは中身を下にずらして上下のバランスをとる */
  var ch=chipY+chipBlock+(10+14)*K,yoff=withCards?0:chipBlock/2;
  cv.width=cw+M*2;cv.height=ch+M*2;
  c.fillStyle="#F4CDD2";c.fillRect(0,0,cv.width,cv.height);
  c.save();c.translate(M,M);
  c.shadowColor="rgba(0,0,0,.25)";c.shadowBlur=4*K;c.shadowOffsetY=2*K;
  c.fillStyle="#fff";rr(c,0,0,cw,ch,15*K);c.fill();c.shadowColor="transparent";
  c.strokeStyle=tc;c.lineWidth=10*K;rr(c,5*K,5*K,cw-10*K,ch-10*K,12*K);c.stroke();
  c.translate(0,yoff);
  /* 星 */
  function star(cx,cy,R,rot){c.save();c.translate(cx,cy);c.rotate(rot*Math.PI/180);c.fillStyle=tc;c.beginPath();
    for(var i=0;i<10;i++){var rad=i%2?R*.45:R,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}c.closePath();c.fill();c.restore()}
  star(cw-60*K,y0+32*K,20*K,-8);star(cw-34*K,y0+78*K,14*K,18);star(52*K,y0+190*K,18*K,-14);
  var im=await loadImg(IMG["char_"+r.top]);
  if(im){var sc=Math.min(charH/im.height,(cw-pad*2)/im.width);c.drawImage(im,(cw-im.width*sc)/2,y0+8*K+(charH-im.height*sc),im.width*sc,im.height*sc)}
  c.textAlign="center";
  var lg=await loadImg(IMG["logo_"+r.top]);
  if(lg){var lh=25*K,lw=lg.width*lh/lg.height;c.drawImage(lg,(cw-lw)/2,nameY-lh+4*K,lw,lh)}
  else{c.fillStyle=acc;c.font='900 '+(30*K)+'px "Zen Maru Gothic",sans-serif';c.fillText(t.name,cw/2,nameY)}
  c.fillStyle=acc;
  c.font='700 '+(16*K)+'px "Zen Maru Gothic",sans-serif';c.fillText(t.category,cw/2,catY);
  c.textAlign="left";c.font='500 '+(12*K)+'px "Zen Maru Gothic",sans-serif';
  dl.forEach(function(l,i){c.fillText(l,pad+10*K,descY+(i+1)*20*K-4*K)});
  if(withCards)chipRows.forEach(function(row,ri){
    var tw=0;row.forEach(function(x){tw+=x[1]});tw+=(row.length-1)*8*K;
    var x=(cw-tw)/2,yy=chipY+ri*30*K;
    row.forEach(function(x2){
      c.fillStyle="#F4CDD2";rr(c,x,yy,x2[1],24*K,12*K);c.fill();c.strokeStyle=acc;c.lineWidth=1*K;c.stroke();
      c.fillStyle=acc;c.textAlign="center";c.fillText(x2[0],x+x2[1]/2,yy+16.5*K);c.textAlign="left";x+=x2[1]+8*K;
    });
  });
  c.restore();
  return cv;
}
var shareCv={me:null,pt:null};
async function buildShare(w){
  var p=S.p[w];if(!p.share)return;
  var sh=p.share;
  try{
    var cv=await makeShareCanvas(w,sh.withCards);
    if(p.share!==sh)return;
    shareCv[w]=cv;sh.url=cv.toDataURL("image/png");
  }catch(e){sh.msg="画像をつくれませんでした。"}
  rendered[w]=null;render(w,true);
}
async function saveBlob(name,data){
  var d=null;try{if(window.claude&&window.claude.use)d=await window.claude.use("downloads")}catch(e){}
  if(d){await d.save({filename:name,data:data});return}
  var bl=data instanceof Blob?data:new Blob([data]);var an=document.createElement("a");
  an.href=URL.createObjectURL(bl);an.download=name;document.body.appendChild(an);an.click();
  setTimeout(function(){an.remove();URL.revokeObjectURL(an.href)},1500);
}
async function saveShare(w){
  var sh=S.p[w].share,cv=shareCv[w];if(!sh||!cv)return;
  var blob=await new Promise(function(r){cv.toBlob(r,"image/png")});
  try{await saveBlob("kachikan-card_"+TYPES[S.p[w].g.result.top].name+".png",blob);sh.msg="保存しました。好きなSNSで投稿できます。"}
  catch(e){sh.msg=(e&&e.code==="declined")?"":"保存できませんでした。画像を長押しして保存してください。"}
  rendered[w]=null;render(w,true);
}
function shareSheet(w){
  var sh=S.p[w].share;if(!sh)return "";
  var h='<div class="sheet"><div class="card shbox"><h3>タイプをシェアする</h3>'+
    '<p class="shnote">画像をつくって保存します。このアプリからは移動しません。相手の名前・5枚・チャットは入りません。</p>';
  h+=sh.url?'<img class="shimg" alt="シェア画像のプレビュー" src="'+sh.url+'">':'<p class="shnote">画像をつくっています…</p>';
  h+='<div class="sw" style="margin-bottom:10px"><button type="button" role="switch" aria-checked="'+sh.withCards+'" aria-label="自分の5枚も載せる" data-act="shareCards"></button>自分の5枚も載せる</div>';
  if(sh.msg)h+='<p class="shnote" role="status"><b>'+esc(sh.msg)+'</b></p>';
  h+='<div class="row"><button class="gbtn pri" type="button" data-act="saveShare"'+(sh.url?'':' disabled')+'>画像を保存</button><button class="gbtn" type="button" data-act="closeShare">閉じる</button></div></div></div>';
  return h;
}

function tutRect(ph,sels){
  var pr=ph.getBoundingClientRect(),L=1e9,T=1e9,R=-1e9,B=-1e9,ok=false;
  sels.forEach(function(q){var e=ph.querySelector(q);if(!e)return;var r=e.getBoundingClientRect();ok=true;
    L=Math.min(L,r.left);T=Math.min(T,r.top);R=Math.max(R,r.right);B=Math.max(B,r.bottom)});
  return ok?{l:L-pr.left,t:T-pr.top,r:R-pr.left,b:B-pr.top,w:pr.width,h:pr.height}:null;
}
function fitIntro(ph){

  if(p.tut<1){fitIntro(ph);return}

  var st=TUT[p.tut],gm=ph.querySelector(".game.g2"),rc=tutRect(ph,st.sel),tail=bub.querySelector(".tail");
  if(gm&&rc&&st.sel[0].indexOf(".live")!==0){
    /* 背が低いスマホでは、説明する場所が画面の外にあるので、スクロールして見える位置に寄せる */
    var pdb=(st.pad||[6,6,6,6])[2],lim=rc.h-70;
    if(rc.b+pdb>lim)gm.scrollTop+=rc.b+pdb-lim;
    else if(rc.t<8&&gm.scrollTop>0)gm.scrollTop=Math.max(0,gm.scrollTop+rc.t-8);
    rc=tutRect(ph,st.sel);
  }
  if(!rc){hl.style.display="none";bub.style.top="35%";if(tail)tail.style.display="none";return}
  var pd=st.pad||[6,6,6,6],l=rc.l-pd[3],t=rc.t-pd[0],wd=(rc.r-rc.l)+pd[1]+pd[3],ht=(rc.b-rc.t)+pd[0]+pd[2];
  hl.style.left=l+"px";hl.style.top=t+"px";hl.style.width=wd+"px";hl.style.height=ht+"px";
  var bh=bub.offsetHeight,gap=20,below=t+ht+gap,fits=below+bh<rc.h-10,top=fits?below:(t-gap-bh);
  top=Math.max(8,top);bub.style.top=top+"px";
  if(tail){tail.className="tail "+(fits?"up":"down");
    var bl=bub.getBoundingClientRect().left-ph.getBoundingClientRect().left;
    tail.style.left=Math.max(18,Math.min(bub.offsetWidth-34,(l+wd/2)-bl-8))+"px";}
}

/* ---------- views ---------- */
function statusBar(){return '<div class="status"><span>9:41</span><span>5G</span></div>'}
function cardIcon(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1F3D" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="11" height="15" rx="2" transform="rotate(-10 8 13)" fill="#fff"/><rect x="9" y="3" width="11" height="15" rx="2" transform="rotate(8 14 10)" fill="#FFD016"/></svg>'}
function charSvg(t){return '<svg viewBox="0 0 160 160" aria-hidden="true"><use href="#char-'+t+'"/></svg>'}

function inviteBlock(w,m){
  var from=m.from,fromName=PERSONA[from].name;
  var st=S.inviteState,html='<div class="inv">';
  if(w===from){
    html+='<h4>価値観カードにお誘いしました</h4><p style="margin-bottom:6px">買い物で大切にしていることを、いっしょに考えるゲームです。</p>';
    var txt={pending:"返事を待っています",later:"あとで返事をするそうです",declined:"今回はまた今度にしましょう、とのことです",accepted:"はじめました"}[st]||"";
    html+='<div class="st">'+txt+'</div>';
  }else{
    html+='<h4>'+esc(fromName)+'さんから、価値観カードのお誘い</h4>';
    html+='<p>「買い物のときに大切にしていること」を、カードを選びながら話すゲームです。同じカードを2人で順番に「残す／手放す」で決めて、大切な5枚に絞ります。10分ほど。</p>';
    if(st==="pending"||st==="later"){
      html+='<div class="row"><button class="gbtn pri" type="button" data-act="accept">やってみる</button>'+
        '<button class="gbtn" type="button" data-act="later"'+(st==="later"?" disabled":"")+'>あとで</button>'+
        '<button class="gbtn" type="button" data-act="decline">今回は見送る</button></div>';
      if(st==="later")html+='<div class="st" style="margin-top:6px">あとで返事をします</div>';
    }else{
      html+='<div class="st">'+(st==="accepted"?"はじめました":"今回は見送りました")+'</div>';
    }
  }
  return html+'</div>';
}

function chatView(w){
  var p=S.p[w],o=other(w),on=PERSONA[o].name;
  var h='<div class="hdr"><button class="ic" type="button" disabled aria-label="戻る">‹</button>'+
    '<button class="whobtn" type="button" data-act="openProfile" data-arg="other" aria-label="'+esc(on)+'さんのプロフィール">'+
    '<span class="av" style="background:'+PERSONA[o].color+'">'+esc(on[0])+'</span><span><b>'+esc(on)+'さん</b><small>オンライン</small></span></button></div>';
  var msgs='<div class="chat" id="chat-'+w+'">';
  var lastInv=-1;
  S.msgs.forEach(function(m,i){if(m.type==="invite")lastInv=i});
  S.msgs.forEach(function(m,i){
    if(m.type==="sys")msgs+='<div class="sys">'+esc(m.text)+'</div>';
    else if(m.type==="invite")msgs+=(i===lastInv?inviteBlock(w,m):'<div class="sys">価値観カードのお誘い(見送り済み)</div>');
    else if(m.type==="cards"){
      var mine=m.from===w;
      msgs+='<div class="cardsmsg '+(mine?"mine":"theirs")+'"><h4>'+(mine?"あなた":esc(PERSONA[m.from].name)+"さん")+'が残した5枚</h4><div class="cc">'+
        m.items.map(function(x,k){return '<span><i>'+(k+1)+'</i>'+esc(x)+'</span>'}).join("")+'</div>'+
        (m.reason?'<div class="rs">'+esc(m.reason)+'</div>':'')+'</div>';
    }
    else msgs+='<div class="msg '+(m.from===w?"mine":"theirs")+'">'+esc(m.text)+'</div>';
  });
  msgs+='</div>';
  var blocked=S.playing||S.inviteState==="pending"||S.inviteState==="later";
  var sug=S.revealed?'<div class="suggest"><button type="button" data-act="fillSuggest">続きは会って話してみる？</button></div>':"";
  var comp='<div class="composer"><button class="cardbtn" type="button" data-act="openSheet" aria-label="価値観カードに誘う"'+(blocked?" disabled":"")+'>'+cardIcon()+'</button>'+
    '<input type="text" id="in-'+w+'" data-bind="composer" value="'+esc(p.composer)+'" placeholder="メッセージ" autocomplete="off">'+
    '<button class="send" type="button" data-act="send">送信</button></div>';
  var sheet="";
  if(p.sheet){
    sheet='<div class="sheet"><div class="card"><h3>価値観カードに誘う</h3>'+
      '<p>買い物をするとき、どんなことを大切にしていますか？ 「安さ」「手作り」「誰が作ったか」など、いろいろな「選ぶ理由」のカードを2人で順番に選んで、大切な5枚に絞るゲームです。理由はチャットで話しながら。10分ほど。返事はあとからでも、見送ってもかまいません。</p>'+
      '<div class="row"><button class="gbtn" type="button" data-act="closeSheet">やめる</button><button class="gbtn pri" type="button" data-act="invite">誘う</button></div></div></div>';
  }
  return h+'<div class="pbody">'+msgs+sug+'</div>'+comp+sheet;
}

function partnerStrip(w){
  var o=other(w),on=PERSONA[o].name,og=S.p[o].g;
  if(!og)return "";
  var s='<div class="ptstrip"><b>'+esc(on)+'さんの様子</b>';
  /* result of the previous card is always shown once both have decided */
  s+='<div>'+(S.round?'前の「'+esc(word(S.round.card))+'」：あなた '+esc(S.round[w])+' / '+esc(on)+'さん '+esc(S.round[o]):'最初のカードです')+'</div>';
  /* this card: the later decider may or may not see the earlier decision (switch above) */
  var od=og.decision;
  if(S.cur!=null){
    if(od&&od.card===S.cur)s+='<div>今回：'+(S.showMoves?'「'+esc(word(S.cur))+'」を'+esc(od.text):'決め終わりました')+'</div>';
    else if(S.turn===w)s+='<div>今回：あなたが先に決める番です</div>';
    else s+='<div>今回：考えています</div>';
  }
  s+='<div class="chips">'+(og.hand.length?og.hand.map(function(i){return "<span>"+esc(word(i))+"</span>"}).join(""):"<span>まだ何も持っていません</span>")+'</div>';
  return s+'</div>';
}

function handList(w,pickable){
  var g=S.p[w].g,h='<div class="hand">';
  for(var i=0;i<5;i++){
    if(i<g.hand.length){
      if(pickable)h+='<button class="slot pick" type="button" data-act="swapTo" data-arg="'+i+'"><span class="n">'+(i+1)+'</span>'+esc(word(g.hand[i]))+'</button>';
      else h+='<div class="slot"><span class="n">'+(i+1)+'</span>'+esc(word(g.hand[i]))+'</div>';
    }else h+='<div class="slot empty">あと'+(5-i)+'枚…</div>';
  }
  return h+'</div>';
}

function partnerBubble(w){
  var o=other(w),on=PERSONA[o].name,og=S.p[o].g;
  function say(card,text){
    var m=/^残した\(「(.+)」と入れ替え\)$/.exec(text);
    if(m)return '「'+esc(word(card))+'」を残して、「'+esc(m[1])+'」を手放したよ';
    return '「'+esc(word(card))+'」を'+esc(text)+'よ';
  }
  var od=og.decision;
  if(S.cur!=null&&od&&od.card===S.cur){
    return S.showMoves?{t:say(od.card,od.text)}:{t:"決め終わったよ",dim:1};
  }
  if(S.cur!=null&&S.turn===o)return {t:"考えているよ…",dim:1};
  if(S.round)return {t:say(S.round.card,S.round[o])};
  return {t:"最初のカードだよ。いっしょに考えよう",dim:1};
}
function gameView(w){
  var g=S.p[w].g,o=other(w),og=S.p[o].g,mine=S.turn===w,on=PERSONA[o].name;
  var left=S.deck.length+(S.cur!=null?1:0);
  var bb=partnerBubble(w);
  var h='<div class="game g2"><div class="zone op"><div class="zname">'+esc(on)+'さん</div>'+
    '<div class="bubble'+(bb.dim?' dim':'')+'" role="status">'+bb.t+'</div><div class="oppills" aria-label="'+esc(on)+'さんが残しているカード">';
  for(var i=0;i<5;i++)h+=i<og.hand.length?'<span>'+esc(word(og.hand[i]))+'</span>':'<span class="e">&nbsp;</span>';
  h+='</div></div><div class="zone me"><div class="g-top"><b>価値観カード</b><span>山札残り '+left+'枚</span></div>';
  if(S.cur!=null){
    h+='<div class="drawn'+(mine?'':' wait')+'"><small>'+(mine?'あなたの番':esc(on)+'さんの番')+'</small><div class="w">'+esc(word(S.cur))+'</div></div>';
    if(!mine){
      h+='<div class="prompt">'+esc(on)+'さんが決めるのを待っています</div><div class="zlabel">あなたが残したカード</div>'+handList(w,false);

}

/* ---------- render ---------- */
var rendered={me:null,pt:null};
function render(w,force){
  var p=S.p[w],el=document.getElementById("phone-"+w);
  if(!force&&p.screen==="reason"&&rendered[w]==="reason")return;
  var inner;
  switch(p.screen){
    case "game":inner=statusBar()+gameView(w);break;
    case "refill":inner=statusBar()+refillView(w);break;
    case "order":inner=statusBar()+orderView(w);break;
    case "reason":inner=statusBar()+reasonView(w);break;
    case "result":inner=statusBar()+resultView(w);break;
    case "shared":inner=statusBar()+'<div class="hdr"><b>お互いの5枚</b></div>'+sharedView(w);break;
    case "profile":inner=statusBar()+profileView(w);break;
    default:inner=statusBar()+chatView(w);
  }
  if(p.screen==='game')inner+=liveBox(w);
  if(p.screen==='game'&&p.tut!=null)inner+=tutOverlay(w);
  inner+=shareSheet(w);
  var ae=document.activeElement,focusId=ae&&(ae.id==="in-"+w||ae.id==="lv-"+w)?ae.id:null,keepFocus=focusId?ae.selectionStart:null;
  el.innerHTML=inner;
  rendered[w]=p.screen;
  if(p.screen==='game'&&p.tut!=null)positionTut(w);
  var chat=document.getElementById("chat-"+w);
  if(chat){var pb=chat.parentNode;pb.scrollTop=pb.scrollHeight}
  if(keepFocus!==null){var inp=document.getElementById(focusId);if(inp){inp.focus();inp.setSelectionRange(keepFocus,keepFocus)}}
}
function refresh(){render("me");render("pt")}
function renderAll(){render("me",true);render("pt",true)}


/* ---------- records (host only) ---------- */
var SESS=[];
function snapshot(){
  var a=S.p.me.g,b=S.p.pt.g;if(!a||!a.result)return null;
  function side(g){return g&&g.result?{cards:g.result.ordered.map(word).join(" > "),type:TYPES[g.result.top].name,reason:(g.reason||"").trim()}:{cards:"",type:"",reason:""}}
  var m=side(a),o=side(b);
  return {time:new Date().toLocaleString("ja-JP"),moves:S.showMoves?"見せる":"見せない",
    guestCards:m.cards,guestType:m.type,guestReason:m.reason,guestConsent:S.p.me.consent?"はい":"いいえ",
    opCards:o.cards,opReason:o.reason,opConsent:S.p.pt.consent?"はい":"いいえ",
    live:S.live.map(function(x){return (x.from==="me"?"お客さん":"運営")+":"+x.text}).join(" / "),
    memo:document.getElementById("c-memo").value.trim()};
}
function pushSession(){var sn=snapshot();if(sn){SESS.push(sn);document.getElementById("c-memo").value=""}updateSaveLabel()}
function updateSaveLabel(){var cur=snapshot()?1:0;document.getElementById("c-save").textContent="記録を保存("+(SESS.length+cur)+"件)"}
function csvCell(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
async function saveRecords(){
  var rows=SESS.slice(),cur=snapshot();if(cur)rows.push(cur);
  var msg=document.getElementById("c-save");
  if(!rows.length){msg.textContent="記録はまだありません";setTimeout(updateSaveLabel,1500);return}
  var head=["日時","相手の判断を見せる設定","お客さんの5枚(順位順)","お客さんのタイプ","お客さんの理由","お客さんが見せ合うを選んだ","運営の5枚","運営の理由","運営が見せ合うを選んだ","ライブコメント","観察メモ"];
  var keys=["time","moves","guestCards","guestType","guestReason","guestConsent","opCards","opReason","opConsent","live","memo"];
  var csv="﻿"+[head].concat(rows.map(function(r){return keys.map(function(k){return r[k]})})).map(function(r){return r.map(csvCell).join(",")}).join("\r\n");
  try{await saveBlob("kachikan-booth-records.csv",csv);msg.textContent="保存しました"}catch(e){}
  setTimeout(updateSaveLabel,1500);
}

/* ---------- network: host is the sequencer, both sides replay the same log ---------- */
var QS=new URLSearchParams(location.search);
var MOCK=QS.get("mock")==="1",PREFIX="kachikan-card-";
var ROLE=null,IS_HOST=false,LOG=[],SEQ=0,TX=null,CONNECTED=false,CODE="";
var LOCAL_ONLY={openSheet:1,closeSheet:1,openShare:1,closeShare:1,shareCards:1,saveShare:1,openProfile:1,closeProfile:1,openOwnFromResult:1,fillSuggest:1,tutNext:1,tutSkip:1};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function $(id){return document.getElementById(id)}
function applyEntry(e){
  RNG=mulberry(e.seed||1);
  try{
    if(e.name==="cfg"){S.showMoves=!!e.arg.showMoves;S.deckSize=e.arg.deckSize||44;refresh()}
    else if(e.name==="reset"){if(IS_HOST)pushSession();S=newState(S);rendered={me:null,pt:null};renderAll()}
    else act(e.w,e.name,e.arg);
  }finally{RNG=Math.random}
  if(IS_HOST)updateSaveLabel();
}
function submit(e){
  if(IS_HOST){e.seed=1+Math.floor(Math.random()*2000000000);e.n=++SEQ;LOG.push(e);applyEntry(e);if(TX)TX({t:"act",e:e})}
  else if(TX)TX({t:"req",e:e});
}
function dispatch(name,arg){
  if(LOCAL_ONLY[name]){act(ROLE,name,arg);return}
  if(!CONNECTED)return;
  var p=S.p[ROLE];
  if(name==="send"){arg=p.composer||"";if(!arg.trim())return;p.composer=""}
  if(name==="liveSend"){arg=p.liveText||"";if(!arg.trim())return;p.liveText=""}
  if(name==="reasonDone")arg=p.g?p.g.reason:"";
  submit({w:ROLE,name:name,arg:arg});
}
function onMessage(m){
  if(!m)return;
  if(m.t==="req"&&IS_HOST){var e=m.e;if(!e||typeof e.name!=="string")return;submit({w:"me",name:e.name,arg:e.arg})}
  else if(m.t==="act"&&!IS_HOST){applyEntry(m.e)}
  else if(m.t==="sync"&&!IS_HOST){
    S=newState();rendered={me:null,pt:null};
    m.log.forEach(function(e){applyEntry(e)});renderAll();
  }
}
function setConnected(on){
  var was=CONNECTED;CONNECTED=on;
  $("netbar").hidden=on||!ROLE||$("join").hidden===false||$("hostwait").hidden===false;
  if(on&&!was)enterApp();
  if(!on&&ROLE&&$("join").hidden&&$("hostwait").hidden)$("netbar").hidden=false;
}
function enterApp(){
  $("join").hidden=true;$("hostwait").hidden=true;
  document.body.className="net role-"+ROLE;
  $("opbtn").hidden=!IS_HOST;
  renderAll();
}
function loadScript(urls,done){
  var i=0;(function next(){
    if(i>=urls.length){done(false);return}
    var s=document.createElement("script");s.src=urls[i++];s.onload=function(){done(true)};s.onerror=next;document.head.appendChild(s);
  })();
}

/* transport: mock (BroadcastChannel, for local testing) or PeerJS */
function startHost(code){
  CODE=code;IS_HOST=true;ROLE="pt";S=newState();LOG=[];SEQ=0;
  $("join").hidden=true;$("hostwait").hidden=false;$("h-code").textContent=code;
  var url=location.href.split("?")[0]+"?c="+code;
  loadScript(["https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"],function(ok){
    if(ok&&window.QRCode){new QRCode($("qr"),{text:url,width:180,height:180,colorDark:"#2A1F3D",colorLight:"#ffffff"})}else $("qr").style.display="none";
  });
  function onGuest(send){
    TX=send;setConnected(true);
    send({t:"sync",log:LOG});
  }
  if(MOCK){
    var ch=new BroadcastChannel("kc-"+code);
    ch.onmessage=function(ev){var d=ev.data;if(d.to!=="host")return;
      if(d.t==="hello"){onGuest(function(m){ch.postMessage({to:"guest",m:m})})}
      else if(d.t==="data")onMessage(d.m)};
    $("h-msg").textContent="相手を待っています…(テスト用)";
    return;
  }
  loadScript(["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"],function(ok){
    if(!ok){$("h-msg").textContent="通信の部品を読み込めませんでした。ネットワークを確認してください。";return}
    var peer=new Peer(PREFIX+code);
    peer.on("error",function(err){
      if(err&&err.type==="unavailable-id"){startHost(String(1000+Math.floor(Math.random()*9000)))}
      else $("h-msg").textContent="接続に問題があります。もう一度お試しください。";
    });
    peer.on("connection",function(c){
      c.on("open",function(){onGuest(function(m){try{c.send(m)}catch(e){}})});
      c.on("data",onMessage);
      c.on("close",function(){TX=null;setConnected(false)});
    });
  });
}
function startGuest(code){
  CODE=code;IS_HOST=false;ROLE="me";S=newState();
  $("j-msg").textContent="つないでいます…";
  if(MOCK){
    var ch=new BroadcastChannel("kc-"+code);
    ch.onmessage=function(ev){var d=ev.data;if(d.to!=="guest")return;onMessage(d.m)};
    TX=function(m){ch.postMessage({to:"host",t:"data",m:m})};
    ch.postMessage({to:"host",t:"hello"});
    setTimeout(function(){setConnected(true)},50);
    return;
  }
  loadScript(["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"],function(ok){
    if(!ok){$("j-msg").textContent="通信の部品を読み込めませんでした。";return}
    var peer=new Peer();var tries=0;
    function connect(){
      var c=peer.connect(PREFIX+code,{reliable:true});
      var opened=false;
      c.on("open",function(){opened=true;tries=0;TX=function(m){try{c.send(m)}catch(e){}};setConnected(true)});
      c.on("data",onMessage);
      c.on("close",function(){TX=null;setConnected(false);setTimeout(connect,2000)});
      c.on("error",function(){});
      setTimeout(function(){if(!opened){try{c.close()}catch(e){}
        if(!CONNECTED){tries++;$("j-msg").textContent=tries>2?"つながりません。コードを確認してください。":"つないでいます…";if(tries<=5)setTimeout(connect,1000)}}},6000);
    }
    peer.on("open",connect);
    peer.on("error",function(err){if(err&&err.type==="peer-unavailable"){$("j-msg").textContent="このコードの部屋が見つかりません。"}});
  });
}

/* ---------- events ---------- */
var stage=$("stage");
stage.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var ph=b.closest(".phone");if(!ph)return;
  var arg=b.dataset.arg;
  if(arg!==undefined&&/^\d+$/.test(arg))arg=Number(arg);
  var name=b.dataset.act;
  if(name==="reasonDone"||name==="orderDone"||name==="openProfile"||name==="closeProfile"||name==="toChat"||name==="openOwnFromResult"||name==="endPrivate"||name==="quit"||name==="toggleProfile"){
    rendered[ROLE]=null;
  }
  dispatch(name,arg);
});
stage.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.bind)return;
  var w=ROLE;
  if(t.dataset.bind==="composer")S.p[w].composer=t.value;
  if(t.dataset.bind==="live")S.p[w].liveText=t.value;
  if(t.dataset.bind==="reason"&&S.p[w].g)S.p[w].g.reason=t.value;
});
stage.addEventListener("keydown",function(e){
  var t=e.target;if(e.isComposing)return;
  if(e.key==="Enter"&&t.dataset&&t.dataset.bind==="live"){S.p[ROLE].liveText=t.value;dispatch("liveSend");return}
  if(e.key==="Enter"&&t.dataset&&t.dataset.bind==="composer"){S.p[ROLE].composer=t.value;dispatch("send")}
});

$("j-enter").addEventListener("click",function(){
  var c=$("j-code").value.replace(/\D/g,"");
  if(c.length!==4){$("j-msg").textContent="4桁のコードを入力してください";return}
  startGuest(c);
});
$("j-code").addEventListener("keydown",function(e){if(e.key==="Enter")$("j-enter").click()});
$("j-host").addEventListener("click",function(){startHost(String(1000+Math.floor(Math.random()*9000)))});
$("opbtn").addEventListener("click",function(){$("oppanel").hidden=false;updateSaveLabel();$("op-info").textContent="接続コード "+CODE});
$("c-close").addEventListener("click",function(){$("oppanel").hidden=true});
$("c-save").addEventListener("click",saveRecords);
function sendCfg(){submit({w:ROLE,name:"cfg",arg:{showMoves:$("c-moves").checked,deckSize:Number($("c-deck").value)}})}
$("c-moves").addEventListener("change",sendCfg);
$("c-deck").addEventListener("change",sendCfg);
$("c-reset").addEventListener("click",function(){submit({w:ROLE,name:"reset"});$("oppanel").hidden=true});

S=newState();
document.body.className="net";
if(QS.get("host")){var hc=QS.get("host");startHost(/^\d{4}$/.test(hc)?hc:String(1000+Math.floor(Math.random()*9000)))}
else if(/^\d{4}$/.test(QS.get("c")||"")){$("j-code").value=QS.get("c");startGuest(QS.get("c"))}
})();
</script>
